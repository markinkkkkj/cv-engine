[project]
name = "cv-engine"
version = "0.1.0"
description = "Currículo adaptativo: banco de experiências em Markdown/YAML, validação e renderização em Typst."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "RUF",     # ruff
    "PTH",     # pathlib em vez de os.path
    "S506",    # yaml.load inseguro
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
